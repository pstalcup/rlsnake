<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>rlsnake</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121212;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas.emscripten {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      border: 0;
      background: #000;
      image-rendering: pixelated;
    }
    #status {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading…</div>

  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        // Reload the page rather than silently freezing if the GL context dies.
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. Please reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        if (statusElement) statusElement.textContent = text;
        if (!text && statusElement) statusElement.style.display = 'none';
      },
      onRuntimeInitialized: function () {
        document.getElementById('canvas').focus();
      }
    };
    Module.setStatus('Loading…');
    window.onerror = function () { Module.setStatus('Something went wrong — check the console.'); };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
